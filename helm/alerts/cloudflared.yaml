groups:
  - name: cloudflared
    rules:
      - alert: CloudflaredHAConnectionsDegraded
        expr: (max(cloudflared_tunnel_ha_connections{deployment_environment_name="production"}) or vector(0)) < 4
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: cloudflared has fewer than 4 HA connections to Cloudflare's edge
          description: >-
            Covers everything from partial degradation down to a full outage (0
            connections). The "or vector(0)" makes this also fire if the metric stops
            arriving entirely (e.g. Alloy or cloudflared itself is down), since a plain
            threshold check would otherwise see no data and stay silent. Scoped to the
            production environment so a devcontainer test run (ENVIRONMENT: development)
            can't page anyone.
      - alert: CloudflaredOriginErrors
        expr: sum(rate(cloudflared_tunnel_request_errors{deployment_environment_name="production"}[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: cloudflared is failing to proxy requests to the app's origin
          description: >-
            Counts errors proxying to origin, distinct from the app's own HTTP error
            responses. Threshold is a starting point - tune after watching real traffic.
            Scoped to the production environment so a devcontainer test run
            (ENVIRONMENT: development) can't page anyone.
