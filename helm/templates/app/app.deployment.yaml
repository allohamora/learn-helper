apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
      annotations:
        checksum/app-env: {{ toYaml .Values.app.env | sha256sum | quote }}
        checksum/postgres-env: {{ toYaml .Values.postgres.env | sha256sum | quote }}
    spec:
      # Without this, the app container can start before postgres is ready to accept
      # connections and crash with ECONNREFUSED. This waits until postgres is reachable.
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.postgres.image | quote }}
          envFrom:
            - secretRef:
                name: postgres-env
          command:
            - sh
            - -c
            - timeout 120 sh -c 'until pg_isready -h postgres -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do sleep 2; done'
      containers:
        - name: app
          image: {{ .Values.app.image | default (printf "learn-helper:%s" .Chart.AppVersion) | quote }}
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: app-env
          env:
            - name: PORT
              value: "3000"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-env
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-env
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-env
                  key: POSTGRES_DB
            - name: POSTGRES_URL
              value: postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          volumeMounts:
            - name: app-uploads
              mountPath: /app/uploads
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: app-uploads
          persistentVolumeClaim:
            claimName: app-uploads
