apiVersion: batch/v1
kind: Job
metadata:
  name: app-migrations
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.images.postgres | quote }}
          envFrom:
            - secretRef:
                name: postgres-env
          command:
            - sh
            - -c
            - |
              until pg_isready \
                --host=postgres \
                --port=5432 \
                --username="$POSTGRES_USER" \
                --dbname="$POSTGRES_DB"
              do
                sleep 2
              done
      containers:
        - name: migrations
          image: {{ .Values.images.app | quote }}
          command: ["npm", "run", "migrations:up"]
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-env
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-env
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-env
                  key: POSTGRES_DB
            - name: POSTGRES_URL
              value: postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
