apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      # Required field, but not enforced by local-path - it just backs this with a
      # plain directory, so Postgres can write past 5Gi without any error.
      storage: 5Gi
