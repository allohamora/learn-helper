apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
      annotations:
        checksum/postgres-env: {{ toYaml .Values.postgres.env | sha256sum | quote }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          args:
            # pg_stat_statements tracks call count, total/mean time, and rows for every
            # distinct query shape run against the database - the actual data behind
            # the slow-query metrics. This loads the module at startup; it still needs
            # the one-time `CREATE EXTENSION pg_stat_statements` (see helm/README.md)
            # before that data is queryable
            - -c
            - shared_preload_libraries=pg_stat_statements
            # logs every individual query taking longer than 300ms, so a single slow
            # execution is visible in logs even if pg_stat_statements' averages aren't
            - -c
            - log_min_duration_statement=300
            # pinned explicitly so the connection-pool-exhaustion alert (numbackends
            # vs. this value) has a known ceiling instead of assuming the image's default
            - -c
            - max_connections=100
          ports:
            - name: db
              containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-env
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            tcpSocket:
              port: db
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: db
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
