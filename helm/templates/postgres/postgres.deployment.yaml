apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
      annotations:
        checksum/postgres-env: {{ toYaml .Values.postgres.env | sha256sum | quote }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          args:
            # pg_stat_statements tracks call count, total/mean time, and rows for every
            # distinct query shape run against the database - the actual data behind
            # Database Observability's query stats. This loads the module at startup;
            # it still needs the one-time `CREATE EXTENSION pg_stat_statements` (see
            # helm/README.md) before that data is queryable
            - -c
            - shared_preload_libraries=pg_stat_statements
            # required by Grafana Database Observability: computes a stable queryid so
            # explain plans/query samples can be correlated back to pg_stat_statements rows
            - -c
            - compute_query_id=on
            # track statements nested inside functions/procedures too, not just top-level
            - -c
            - pg_stat_statements.track=all
            # default (1024) truncates long queries in pg_stat_activity before Database
            # Observability's query-sample collector can read them
            - -c
            - track_activity_query_size=4096
          ports:
            - name: db
              containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-env
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            tcpSocket:
              port: db
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: db
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
