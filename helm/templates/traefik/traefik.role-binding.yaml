{{- if .Values.alloy.enabled }}
# Binds traefik.role.yaml's namespaced Role to Alloy's ServiceAccount. Both the Role
# and this RoleBinding live in kube-system - a RoleBinding can only reference a Role
# from its own namespace, which is exactly the scope needed here.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-alloy-traefik
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-alloy-traefik
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: {{ .Release.Namespace }}
{{- end }}
