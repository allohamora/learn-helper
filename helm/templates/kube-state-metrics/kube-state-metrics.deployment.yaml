{{- if .Values.kubeStateMetrics.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-state-metrics
  template:
    metadata:
      labels:
        app: kube-state-metrics
    spec:
      serviceAccountName: kube-state-metrics
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kube-state-metrics
          image: {{ .Values.kubeStateMetrics.image | quote }}
          # Restricts kube-state-metrics' own watches to the same object kinds granted in
          # kube-state-metrics.cluster-role.yaml - it would otherwise try (and fail, then log
          # noisy errors) to watch everything its default resource list covers.
          # --namespaces further restricts namespaced resources (pods, deployments, ...) to
          # this release's own namespace, so cluster add-ons like kube-system's coredns/traefik
          # don't clutter dashboards/kubernetes.json's panels. Nodes are cluster-scoped and stay
          # unaffected by this flag - kube_node_status_condition still covers every node.
          args:
            - --resources=pods,nodes,persistentvolumeclaims,deployments,replicasets,statefulsets,daemonsets,jobs,cronjobs
            - --namespaces={{ .Release.Namespace }}
          ports:
            - name: metrics
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
{{- end }}
