apiVersion: apps/v1
kind: Deployment
metadata:
  name: learn-helper
  namespace: learn-helper
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: learn-helper
  template:
    metadata:
      labels:
        app: learn-helper
    spec:
      # Matches the old Nomad shutdown_delay=10s: give in-flight requests time to
      # drain before the process receives SIGTERM (grace period alone only delays
      # the SIGKILL-after-SIGTERM, not the initial removal from the Service/SIGTERM).
      terminationGracePeriodSeconds: 15
      containers:
        - name: app
          image: learn-helper:local
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: learn-helper-env
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: learn-helper
  namespace: learn-helper
spec:
  selector:
    app: learn-helper
  ports:
    - name: http
      port: 3000
      targetPort: http
---
# Security headers: nosniff, frame-deny, referrer-policy, HSTS (1 year)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: sec
  namespace: learn-helper
spec:
  headers:
    contentTypeNosniff: true
    frameDeny: true
    referrerPolicy: strict-origin-when-cross-origin
    stsSeconds: 31536000
---
# Token bucket: 100 request burst, refills 50/s
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ratelimit
  namespace: learn-helper
spec:
  rateLimit:
    average: 50
    burst: 100
---
# gzip/brotli/zstd negotiated via Accept-Encoding
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: compress
  namespace: learn-helper
spec:
  compress: {}
---
# HTML pages: allow bfcache but force revalidation
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: cache-html
  namespace: learn-helper
spec:
  headers:
    customResponseHeaders:
      Cache-Control: "private, max-age=0, must-revalidate"
---
# favicon.ico: 1-day public cache
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: cache-favicon
  namespace: learn-helper
spec:
  headers:
    customResponseHeaders:
      Cache-Control: "public, max-age=86400"
      Vary: "Accept-Encoding"
---
# image/media files: 7-day cache with stale fallback
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: cache-media
  namespace: learn-helper
spec:
  headers:
    customResponseHeaders:
      Cache-Control: "public, max-age=604800, stale-while-revalidate=600, stale-if-error=86400"
      Vary: "Accept-Encoding"
---
# Catch-all HTML router. Priority 1 ensures all specific routers below (priority >= 15) take precedence.
# Edit the Host(...) rule below if you need a custom Cloudflare hostname instead of localhost.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: learn-helper
  namespace: learn-helper
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`localhost`)
      kind: Rule
      priority: 1
      middlewares:
        - name: sec
        - name: ratelimit
        - name: compress
        - name: cache-html
      services:
        - name: learn-helper
          port: http
---
# /api/ - no cache header
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: learn-helper-api
  namespace: learn-helper
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`localhost`) && PathPrefix(`/api/`)
      kind: Rule
      priority: 20
      middlewares:
        - name: sec
        - name: ratelimit
        - name: compress
      services:
        - name: learn-helper
          port: http
---
# /favicon.ico - 1-day cache
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: learn-helper-favicon
  namespace: learn-helper
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`localhost`) && Path(`/favicon.ico`)
      kind: Rule
      priority: 25
      middlewares:
        - name: sec
        - name: ratelimit
        - name: compress
        - name: cache-favicon
      services:
        - name: learn-helper
          port: http
---
# image/media files - 7-day cache. Priority 15 ensures /favicon.ico (priority 25) wins
# over the .ico match here.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: learn-helper-media
  namespace: learn-helper
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`localhost`) && PathRegexp(`(?i)\.(png|jpe?g|gif|svg|webp|avif|ico)$`)
      kind: Rule
      priority: 15
      middlewares:
        - name: sec
        - name: ratelimit
        - name: compress
        - name: cache-media
      services:
        - name: learn-helper
          port: http
